<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat-Elite Ultimate</title>
<style>
body{background:#050805;color:#00ff88;font-family:monospace;padding:15px}
h1{border:2px solid #00ff88;text-align:center;box-shadow:0 0 20px #00ff88;padding:15px}
.box{border:1px solid #00ff88;padding:15px;margin:15px 0}
input,textarea{width:95%;padding:12px;background:#000;color:#00ff88;border:1px solid #00ff88}
button{background:#00ff88;color:#000;padding:12px;font-weight:bold;width:100%;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h1>⚡ THREAT-ELITE - UNLIMITED</h1>
<div class="box">
<input id="ip" placeholder="Enter IP e.g. 8.8.8.8">
<button onclick="check()">CHECK THREAT</button>
</div>
<div class="box">
<textarea id="txt" placeholder="Text for Voice + Image"></textarea>
<button onclick="gen()">GENERATE VOICE + IMAGE</button>
</div>
<div class="box"><pre id="out">Ready...</pre><div id="img"></div></div>
<script>
async function check(){
 let ip=document.getElementById('ip').value||'8.8.8.8';
 document.getElementById('out').innerText='Checking via /api/unlimited.js ...';
 let r=await fetch(`/api/unlimited.js?ip=${ip}`).then(x=>x.json());
 document.getElementById('out').innerText=JSON.stringify(r,null,2);
}
function gen(){
 let t=document.getElementById('txt').value;
 if(!t)return alert('Text ivvu bro');
 speechSynthesis.speak(new SpeechSynthesisUtterance(t));
 let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(t+' hacker neon')}`;
 document.getElementById('img').innerHTML=`<img src="${url}" style="width:100%;border:1px solid #00ff88;margin-top:10px"><br><a href="${url}" target="_blank"><button>Download Image</button></a>`;
 document.getElementById('out').innerText='Voice Playing: '+t;
}
</script>
</body>
</html>
